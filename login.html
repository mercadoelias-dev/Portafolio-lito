<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrina U - Iniciar sesión</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <a href="vitrina.html" class="logo" style="text-decoration: none; color: inherit;">
            <div class="logo-icon">V</div>
            <div class="logo-text">
                Vitrina <span>·U</span>
            </div>
        </a>

        <section class="login-card">

            <h1>Bienvenido de nuevo</h1>

            <p class="subtitle">
                Inicia sesión para continuar con tus proyectos.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@universidad.edu.co" required>
                </div>

                <div class="form-group">
                    <div class="password-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot">¿La olvidaste?</a>
                    </div>

                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    Iniciar sesión
                </button>

                <div class="message" id="message">
                    Inicio de sesión enviado correctamente.
                </div>

            </form>

            <div class="divider">o</div>

            <p class="register">
                ¿No tienes una cuenta?
                <a href="#">Crear cuenta</a>
            </p>

        </section>

    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return;

            // Guardar datos de sesión simulada en el navegador
            localStorage.setItem('sesion_iniciada', 'true');
            localStorage.setItem('usuario_activo', email);

            // Estado visual de carga y éxito
            loginBtn.textContent = 'Iniciando sesión...';
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.85';
            loginBtn.style.cursor = 'wait';

            message.textContent = '¡Inicio de sesión exitoso! Redirigiendo a la vitrina...';
            message.style.display = 'block';

            // Redireccionar a vitrina.html
            setTimeout(() => {
                window.location.href = 'vitrina.html';
            }, 800);
        });
    </script>
</body>

</html>
